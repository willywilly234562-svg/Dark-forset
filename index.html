<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riddle & Steel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');
      
      html, body, #root {
        height: 100dvh;
        overflow: hidden;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: #051a05; /* Dark Forest Green */
        color: #e2e8f0;
      }
      
      h1, h2, h3, h4, h5, h6, .cinzel {
        font-family: 'Cinzel', serif;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f291e; 
      }
      ::-webkit-scrollbar-thumb {
        background: #355e3b; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4a7c59; 
      }

      /* Character Animations */
      @keyframes breathe {
        0%, 100% { transform: scaleY(1) translateY(0); }
        50% { transform: scaleY(1.02) translateY(-1px); }
      }
      
      /* Updated Walk: Waddle/Rocking to simulate feet moving */
      @keyframes walk {
        0% { transform: translateY(0) rotate(-6deg); }
        25% { transform: translateY(-4px) rotate(0deg); }
        50% { transform: translateY(0) rotate(6deg); }
        75% { transform: translateY(-4px) rotate(0deg); }
        100% { transform: translateY(0) rotate(-6deg); }
      }

      /* Internal SVG Animations */
      @keyframes internal-slash {
        0% { transform: rotate(0deg); }
        20% { transform: rotate(-30deg); } 
        50% { transform: rotate(110deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes internal-punch {
        0% { transform: translate(0, 0); }
        40% { transform: translate(4px, -3px); }
        100% { transform: translate(0, 0); }
      }

      .animate-breathe {
        animation: breathe 2s infinite ease-in-out;
      }
      
      .animate-walk {
        animation: walk 0.4s infinite linear;
      }

      .animate-sword-swing {
        animation: internal-slash 0.25s ease-out;
        transform-box: fill-box;
      }
      
      .animate-arm-punch {
        animation: internal-punch 0.2s ease-out;
      }

      /* Image Rendering for Pixel Art crispness */
      .pixel-render {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
    </style>

{

}
</script>
